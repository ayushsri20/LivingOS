name: Deploy checks

on:
  push:
    branches: [ feature/react-production ]
  pull_request:
    branches: [ feature/react-production ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django checks and deploy readiness
        env:
          SECRET_KEY: dummy-secret-for-ci
          DEBUG: 'False'
          ALLOWED_HOSTS: 'testserver,panesar-pg-772316.onrender.com'
          CSRF_TRUSTED_ORIGINS: 'https://livingos-frontend.vercel.app'
          CORS_ALLOWED_ORIGINS: 'https://livingos-frontend.vercel.app'
        run: |
          python manage.py check
          python manage.py check_deploy_ready || true
      - name: Run tests
        run: |
          python manage.py test --verbosity=2
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
      - name: Run frontend build
        working-directory: frontend
        run: |
          npm run build
      - name: Run frontend contract tests
        working-directory: frontend
        run: |
          npm run test:contract || true
